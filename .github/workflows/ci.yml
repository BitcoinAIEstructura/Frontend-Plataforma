name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    name: tipos, estilo, pruebas y compilación
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos (TypeScript estricto)
        run: npm run typecheck

      - name: Estilo (ESLint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npx prettier --check src

      - name: Pruebas (Vitest)
        run: npm test

      - name: Compilación de producción
        run: npm run build
